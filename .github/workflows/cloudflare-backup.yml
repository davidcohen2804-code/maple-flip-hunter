name: Licence database backup (weekly, free)

# Exports the D1 database to SQL and keeps it as a GitHub artifact for 90 days (D1 Time Travel adds 30-day
# point-in-time restore on top). Needs the same CLOUDFLARE_* secrets as the deploy workflow.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g wrangler@4
      - run: |
          cd server/cloudflare
          ID=$(wrangler d1 list --json | python3 -c "import json,sys; print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='mfh-licenses'))")
          sed -i "s/REPLACED_BY_DEPLOY/$ID/" wrangler.toml
          wrangler d1 export mfh-licenses --remote --output ../../licenses-backup.sql
          wc -l ../../licenses-backup.sql
      - uses: actions/upload-artifact@v4
        with:
          name: licenses-backup-${{ github.run_number }}
          path: licenses-backup.sql
          retention-days: 90
