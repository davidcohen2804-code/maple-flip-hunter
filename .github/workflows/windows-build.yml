name: windows-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests (synthetic)
        run: python -m pytest tests/unit -q --junitxml=reports/unit-results.xml

      - name: Build MapleFlipHunter.exe
        run: python -m PyInstaller --noconfirm --clean build/windows/MapleFlipHunter.spec

      - name: Package (UNVERIFIED until every check below passes)
        shell: pwsh
        run: Compress-Archive -Path dist\MapleFlipHunter\* -DestinationPath MapleFlipHunter-win64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MapleFlipHunter-win64-UNVERIFIED
          path: MapleFlipHunter-win64.zip
          if-no-files-found: ignore

      # ---- gates: any failure below fails the job and no VERIFIED artifact is produced ----
      - name: Try to install a virtual audio output device (GitHub runners have no sound card)
        id: vaudio
        timeout-minutes: 6
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip -OutFile Scream4.0.zip
          Expand-Archive -Path Scream4.0.zip -DestinationPath Scream
          Import-Certificate -FilePath Scream\Install\driver\x64\Scream.cat -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $p = Start-Process -FilePath "Scream\Install\helpers\devcon-x64.exe" -ArgumentList "install","Scream\Install\driver\x64\Scream.inf","*Scream" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "devcon timed out" }
          Start-Service -Name audiosrv -ErrorAction SilentlyContinue
          python -c "from PySide6.QtMultimedia import QMediaDevices; print('audio outputs:', [d.description() for d in QMediaDevices.audioOutputs()])"
      - name: Windows runtime checks (audio when a device exists, tray notification, window, startup key)
        run: python -m pytest tests/windows -q -rA --junitxml=reports/windows-results.xml

      - name: Live source tests (real cozy.markets + maplestory.watch, measured here)
        env:
          MFH_LIVE: "1"
          MFH_LIVE_SECONDS: "120"
        run: python -m pytest tests/live -q -rA --junitxml=reports/live-results.xml

      - name: Smoke-run the built EXE headless for 90 s against live sources (must keep scanning with any blocked source)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MapleFlipHunter\MapleFlipHunter.exe" -ArgumentList "--headless","--seconds","90","--out","reports\exe_headless_result.json" -PassThru -Wait
          "exe exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path reports\exe_headless_result.json)) { "NO RESULT FILE"; exit 1 }
          python tools/check_headless_result.py reports\exe_headless_result.json

      - name: EXE against the local Club FM simulator (live feed with token -> alert -> sound; no maplefm.gg traffic)
        shell: pwsh
        run: |
          $sim = Start-Process -FilePath python -ArgumentList "tools/clubfm_simulator.py" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath "dist\MapleFlipHunter\MapleFlipHunter.exe" -ArgumentList "--headless","--seconds","45","--settings","tools\clubfm_sim_settings.json","--out","reports\exe_clubfm_sim_result.json" -PassThru -Wait
          Stop-Process -Id $sim.Id -Force
          "exe exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          python tools/check_clubfm_sim_result.py reports\exe_clubfm_sim_result.json

      - name: Write verification report and package the home-test build
        shell: pwsh
        run: |
          python tools/ci_report.py reports reports\VERIFICATION_REPORT.md
          Copy-Item reports\VERIFICATION_REPORT.md dist\MapleFlipHunter\VERIFICATION_REPORT.md
          Copy-Item README_HE.md dist\MapleFlipHunter\README_HE.md
          Compress-Archive -Force -Path dist\MapleFlipHunter\* -DestinationPath MapleFlipHunter-win64.zip
          Get-Content reports\VERIFICATION_REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: MapleFlipHunter-win64
          path: MapleFlipHunter-win64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            tests/live/last_live_measurements.json
          if-no-files-found: ignore
